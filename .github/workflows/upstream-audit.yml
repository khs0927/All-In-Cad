name: upstream-audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  validate-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate lock structure
        run: python scripts/upstream/check_pins.py
      - name: Compare pins with current upstream heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/upstream/check_pins.py \
            --online \
            --json-output upstream-audit.json
      - uses: actions/upload-artifact@v4
        with:
          name: upstream-audit
          path: upstream-audit.json
