name: core-ci

on:
  workflow_dispatch:
  push:
    branches: ["main", "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,headless]"
      - run: ruff check src tests scripts
      - run: pytest
      - name: Validate upstream lock JSON
        run: python -m json.tool upstream/upstream.lock.json > /dev/null
      - name: Validate layer config JSON
        run: python -m json.tool configs/architectural-layers.json > /dev/null
      - name: Validate upstream pin structure
        run: python scripts/upstream/check_pins.py

  native-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build native/shared/AllInCad.NativeProtocol.csproj --configuration Release
      - run: dotnet build native/headless/AllInCad.ACadSharpProbe.csproj --configuration Release
      - run: dotnet build native/smoke/AllInCad.SmokeClient.csproj --configuration Release
      - name: Exercise ACadSharp capability probe
        run: >
          dotnet run --project native/headless/AllInCad.ACadSharpProbe.csproj
          --configuration Release --no-build -- --capabilities

  native-scaffold-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert AutoCAD 2027 targets .NET 10
        run: >
          grep -q '<TargetFramework>net10.0-windows</TargetFramework>'
          native/autocad2027/AllInCad.AutoCAD2027.csproj
      - name: Assert ZWCAD adapter targets .NET Framework 4.8
        run: >
          grep -q '<TargetFramework>net48</TargetFramework>'
          native/zwcad2026/AllInCad.ZWCAD2026.csproj
      - name: Assert ZWCAD local API bindings are detected by SDK path
        run: |
          grep -q 'ZWCAD2026_DIR' native/zwcad2026/AllInCad.ZWCAD2026.csproj
          grep -q 'ZwManaged.dll' native/zwcad2026/AllInCad.ZWCAD2026.csproj
          grep -q 'ZwDatabaseMgd.dll' native/zwcad2026/AllInCad.ZWCAD2026.csproj
      - name: Assert shared pipe is current-user-only
        run: grep -q 'PipeOptions.CurrentUserOnly' native/shared/CurrentUserPipeServer.cs
      - name: Assert copyleft tools remain external
        run: >
          grep -q '"integration":"external-executable-only"'
          upstream/upstream.lock.json


